<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雨夜日式便利店街角微缩模型</title>
  <style>
    body {
      margin: 0;
      background: #0a0e24;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
#wx{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:10;display:flex;gap:6px;background:rgba(10,14,32,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:6px;border-radius:999px;box-shadow:0 4px 18px rgba(0,0,0,.35)} #wx button{border:0;border-radius:999px;padding:7px 14px;font-size:13px;font-family:sans-serif;color:#dfe8ff;background:transparent;cursor:pointer;transition:all .15s} #wx button.on{background:#ffd166;color:#221a08;font-weight:700} #wx button:active{transform:scale(.96)}
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<div id="wx">
  <button data-w="rain" class="on">雨夜</button>
  <button data-w="sunset">夕阳</button>
  <button data-w="sunny">晴天</button>
  <button data-w="cloudy">阴天</button><button data-w="snow">雪夜</button>
</div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e24);
    scene.fog = new THREE.Fog(0x0a0e24, 55, 110);

    const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(30, 22, 34);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.5, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 14;
    controls.maxDistance = 80;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.update();

    const clock = new THREE.Clock();

    const hemiLight = new THREE.HemisphereLight(0x8fb4ff, 0x1a1626, 0.55);
    scene.add(hemiLight);

    const moonLight = new THREE.DirectionalLight(0xa8c4ff, 0.7);
    moonLight.position.set(-18, 30, -12);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.width = 2048;
    moonLight.shadow.mapSize.height = 2048;
    moonLight.shadow.camera.left = -32;
    moonLight.shadow.camera.right = 32;
    moonLight.shadow.camera.top = 32;
    moonLight.shadow.camera.bottom = -32;
    moonLight.shadow.camera.near = 1;
    moonLight.shadow.camera.far = 80;
    moonLight.shadow.bias = -0.0004;
    moonLight.shadow.normalBias = 0.02;
    scene.add(moonLight);

    const ASSEMBLY = [];
    const RIPPLES = [];
    let RAIN = null;
let SNOW = null;

    let GRAD = null;
    function makeGrad() {
      const size = 4;
      const data = new Uint8Array([
        0, 0, 0, 255,
        64, 64, 64, 255,
        128, 128, 128, 255,
        255, 255, 255, 255
      ]);
      const tex = new THREE.DataTexture(data, size, 1, THREE.RGBAFormat);
      tex.minFilter = THREE.NearestFilter;
      tex.magFilter = THREE.NearestFilter;
      tex.needsUpdate = true;
      GRAD = tex;
    }
    makeGrad();

    function toon(color) {
      return new THREE.MeshToonMaterial({ color, gradientMap: GRAD });
    }

    function glowMat(color) {
      return new THREE.MeshBasicMaterial({ color });
    }

    function B(parent, w, h, d, mat, x, y, z, ry = 0) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.rotation.y = ry;
      mesh.castShadow = !mat.transparent;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function CYL(parent, rt, rb, h, mat, x, y, z, seg = 18) {
      const geo = new THREE.CylinderGeometry(rt, rb, h, seg);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.castShadow = !mat.transparent;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function PLN(parent, w, h, mat, x, y, z, rx = 0, ry = 0) {
      const geo = new THREE.PlaneGeometry(w, h);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y, z);
      mesh.rotation.x = rx;
      mesh.rotation.y = ry;
      mesh.receiveShadow = true;
      parent.add(mesh);
      return mesh;
    }

    function reg(obj, delay) {
      obj.userData.finalY = obj.position.y;
      obj.position.y -= 6;
      ASSEMBLY.push({ obj, delay });
      return obj;
    }

    function textTex(text, fg, bg, w = 512, h = 128, font = 64) {
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = fg;
      ctx.font = `bold ${font}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, w / 2, h / 2);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function framedTex(main, sub, bg, w = 512, h = 320, mainPx = 120) {
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(6, h * 0.045);
      const mg = h * 0.07; ctx.strokeRect(mg, mg, w - 2 * mg, h - 2 * mg);
      ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = `bold ${mainPx}px sans-serif`;
      ctx.fillText(main, w / 2, sub ? h * 0.40 : h * 0.52);
      if (sub) { ctx.font = `${Math.round(mainPx * 0.42)}px sans-serif`; ctx.fillText(sub, w / 2, h * 0.75); }
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 4;
      return tex;
    }

    function buildBase() {
      B(scene, 44, 1.6, 44, toon(0x2c3145), 0, -0.8, 0);

      const sidewalkMat = toon(0x707a8f);
      const asphaltMat = toon(0x22263a);
      const curbMat = toon(0x8a93a8);
      const crossMat = new THREE.MeshPhongMaterial({ color: 0xdfe8ff, shininess: 90 });
      const puddleMat = new THREE.MeshPhongMaterial({ color: 0x39558a, shininess: 130, transparent: true, opacity: 0.6 });
      const parkingMat = new THREE.MeshPhongMaterial({ color: 0xd8dfe8, shininess: 100 });

      reg(B(scene, 26, 0.12, 12, sidewalkMat, -8, 0.06, -5), 0);
      reg(B(scene, 12, 0.12, 22, sidewalkMat, 15, 0.06, -5), 0.06);
      reg(B(scene, 44, 0.1, 14.5, asphaltMat, 0, 0.05, 14.75), 0.1);
      reg(B(scene, 14.5, 0.1, 29.5, asphaltMat, 14.75, 0.05, -7.25), 0.16);

      reg(B(scene, 44, 0.16, 0.35, curbMat, 0, 0.08, 7.35), 0.2);
      reg(B(scene, 0.35, 0.16, 29.5, curbMat, 7.15, 0.08, -7.25), 0.22);

      for (let i = 0; i < 6; i++) {
        const px = -12 + i * 5;
        reg(B(scene, 0.4, 0.06, 2.8, crossMat, px, 0.12, 8.2), 0.05 + i * 0.01);
      }
      for (let i = 0; i < 6; i++) {
        const pz = -12 + i * 5;
        reg(B(scene, 2.8, 0.06, 0.4, crossMat, 8.2, 0.12, pz), 0.05 + i * 0.01);
      }

      const puddles = [
        { x: -14, z: 12, r: 1.6 },
        { x: 4, z: 14.2, r: 2.0 },
        { x: 13, z: -12, r: 2.2 },
        { x: 5, z: -4, r: 1.2 }
      ];
      puddles.forEach((p, idx) => {
        const geo = new THREE.CircleGeometry(p.r, 28);
        const mesh = new THREE.Mesh(geo, puddleMat);
        mesh.rotation.x = -Math.PI / 2;
        mesh.position.set(p.x, 0.13, p.z);
        mesh.receiveShadow = true;
        scene.add(mesh);
        reg(mesh, 0.08 + idx * 0.04);
      });

      const stallBase = [
        { x: 10.5, z: -9.5 },
        { x: 14.5, z: -9.5 },
        { x: 18.5, z: -9.5 }
      ];
      stallBase.forEach((s, idx) => {
        reg(B(scene, 3.6, 0.04, 0.12, parkingMat, s.x, 0.12, s.z), 0.14 + idx * 0.02);
        reg(B(scene, 0.12, 0.04, 5.2, parkingMat, s.x - 1.85, 0.12, s.z), 0.14 + idx * 0.02);
        reg(B(scene, 0.12, 0.04, 5.2, parkingMat, s.x + 1.85, 0.12, s.z), 0.14 + idx * 0.02);
      });
    }

    function buildStore(){
  const store = new THREE.Group();
  scene.add(store);
  // 墙
  const wallMat = toon(0xf3eee1);
  const backWall = B(store,17,6.8,0.5,wallMat,0,3.4,-9);
  reg(backWall,0.35);
  const leftWall = B(store,9.5,6.8,0.5,wallMat,-8.25,3.4,-4);
  reg(leftWall,0.42);
  const rightWall = B(store,9.5,6.8,0.5,wallMat,8.25,3.4,-4);
  reg(rightWall,0.42);
  const frontLeft = B(store,3.5,6.8,0.5,wallMat,-6.75,3.4,1.75);
  reg(frontLeft,0.5);
  const frontRight = B(store,3.5,6.8,0.5,wallMat,6.75,3.4,1.75);
  reg(frontRight,0.5);
  const frontTop = B(store,17,3.2,0.5,wallMat,0,5.2,1.75);
  reg(frontTop,0.5);
  const glassBase = B(store,15.6,0.25,0.4,wallMat,0,0.125,1.8);
  reg(glassBase,0.56);
  // 屋顶
  const roof = B(store,17.6,0.35,10,toon(0x39415e),0,6.975,-3.5);
  reg(roof,0.6);
  const eave = B(store,17.2,0.07,0.3,glowMat(0x37e0c8),0,6.82,2.1);
  reg(eave,0.66);
  // 品牌条纹
  const stripeMatO = toon(0xff8c42);
  const stripeMatG = toon(0x7ac74f);
  const stripeFO1 = B(store,17,0.35,0.16,stripeMatO,0,4.15,1.95);
  reg(stripeFO1,0.7);
  const stripeFG1 = B(store,17,0.35,0.16,stripeMatG,0,3.8,1.95);
  reg(stripeFG1,0.72);
  const stripeRO1 = B(store,11,0.35,0.16,stripeMatO,8.35,4.15,-3.5);
  stripeRO1.rotation.y = Math.PI/2;
  reg(stripeRO1,0.74);
  const stripeRG1 = B(store,11,0.35,0.16,stripeMatG,8.35,3.8,-3.5);
  stripeRG1.rotation.y = Math.PI/2;
  reg(stripeRG1,0.76);
  // 玻璃带
  const glassMat = new THREE.MeshPhongMaterial({color:0xaad4f5, transparent:true, opacity:0.16, shininess:140});
  const frameMat = toon(0xcfd6dd);
  const glassH = 3.35;
  const glassY = 1.925;
  const glassZ = 1.95;
  const glassL = B(store,5,glassH,0.08,glassMat,-5.3,glassY,glassZ);
  reg(glassL,0.78);
  const glassR = B(store,5,glassH,0.08,glassMat,5.3,glassY,glassZ);
  reg(glassR,0.8);
  const glassM1 = B(store,1.15,glassH,0.08,glassMat,-1.175,glassY,glassZ);
  reg(glassM1,0.84);
  const glassM2 = B(store,1.15,glassH,0.08,glassMat,1.175,glassY,glassZ);
  reg(glassM2,0.84);
  const mullionL = B(store,0.14,glassH,0.16,frameMat,-2.8,glassY,glassZ);
  reg(mullionL,0.86);
  const mullionR = B(store,0.14,glassH,0.16,frameMat,2.8,glassY,glassZ);
  reg(mullionR,0.86);
  const mullionLM = B(store,0.14,glassH,0.16,frameMat,-0.025,glassY,glassZ);
  reg(mullionLM,0.88);
  const mullionRM = B(store,0.14,glassH,0.16,frameMat,0.025,glassY,glassZ);
  reg(mullionRM,0.88);
  const beamBot = B(store,15.6,0.12,0.18,frameMat,0,0.31,glassZ);
  reg(beamBot,0.9);
  const beamTop = B(store,15.6,0.12,0.18,frameMat,0,3.59,glassZ);
  reg(beamTop,0.9);
  // 自动门
  const doorFrameL = B(store,0.12,glassH,0.16,toon(0x2a3240),-1.2,glassY,glassZ);
  reg(doorFrameL,0.94);
  const doorFrameR = B(store,0.12,glassH,0.16,toon(0x2a3240),1.2,glassY,glassZ);
  reg(doorFrameR,0.94);
  const doorTop = B(store,2.4,0.12,0.16,toon(0x2a3240),0,3.59,glassZ);
  reg(doorTop,0.96);
  const door1 = B(store,1.15,glassH,0.06,glassMat,-0.585,glassY,glassZ);
  reg(door1,0.98);
  const door2 = B(store,1.15,glassH,0.06,glassMat,0.585,glassY,glassZ);
  reg(door2,0.98);
  const handle1 = B(store,0.06,0.75,0.08,toon(0x3a4456),-0.02,1.5,2.08);
  reg(handle1,1.0);
  const handle2 = B(store,0.06,0.75,0.08,toon(0x3a4456),0.02,1.5,2.08);
  reg(handle2,1.0);
  const sensor = B(store,0.5,0.18,0.28,toon(0x2a3240),0,3.82,1.9);
  reg(sensor,1.02);
  // 招牌
  const signBox = B(store,15,1.3,0.5,toon(0x141a33),0,5.7,1.7);
  reg(signBox,1.05);
  const signTex = textTex('24H 便利店','#ff5da2','#141a33',1024,160,92);
  const signFace = PLN(store,15,1.3,new THREE.MeshBasicMaterial({map:signTex}),0,5.7,1.48,0,0);
  reg(signFace,1.08);
  const sideSign = B(store,0.25,2.2,0.5,toon(0x141a33),8.35,4.6,-6.5);
  reg(sideSign,1.1);
  const sideSignTex = textTex('便利店','#37e0c8','#141a33',256,512,120);
  const sideFace = PLN(store,0.5,2.2,new THREE.MeshBasicMaterial({map:sideSignTex}),8.2,4.6,-6.5,0,Math.PI/2);
  reg(sideFace,1.12);
  // 雨棚
  const canopy = B(store,6,0.08,1.7,new THREE.MeshPhongMaterial({color:0x1c2b52, transparent:true, opacity:0.75}),0,4.45,2.8);
  canopy.rotation.x = -0.18;
  reg(canopy,1.14);
  const brace1 = CYL(store,0.08,0.08,1.8,toon(0x3a4456),-2.6,2.6,3.4,8);
  reg(brace1,1.16);
  const brace2 = CYL(store,0.08,0.08,1.8,toon(0x3a4456),2.6,2.6,3.4,8);
  reg(brace2,1.16);
  // 地垫
  const mat = B(store,6,0.06,1.4,toon(0x3a3f4d),0,0.09,3.2);
  reg(mat,0.48);
  // 屋顶设备
  const ac1 = B(store,1.4,1.1,1.1,toon(0x9aa3ad),-5.5,7.5,-5);
  reg(ac1,1.18);
  const fan1 = CYL(store,0.5,0.5,0.1,toon(0x4b5563),-5.5,7.85,-4.3,12);
  fan1.rotation.x = Math.PI/2;
  reg(fan1,1.2);
  const ac2 = B(store,1.4,1.1,1.1,toon(0x9aa3ad),5.5,7.5,-5);
  reg(ac2,1.18);
  const fan2 = CYL(store,0.5,0.5,0.1,toon(0x4b5563),5.5,7.85,-4.3,12);
  fan2.rotation.x = Math.PI/2;
  reg(fan2,1.2);
  const duct = CYL(store,0.4,0.4,2.4,toon(0x6b7683),2,8.0,-7,10);
  reg(duct,1.22);
  // 后墙内衬
  const innerBack = B(store,16.6,6.4,0.06,toon(0xffe9c4),0,3.2,-8.85);
  reg(innerBack,0.38);
  // 店前暖光
  const warmLight = new THREE.PointLight(0xffc98a, 60, 26, 1.8);
  warmLight.position.set(0,3.2,5.5);
  scene.add(warmLight);
}
    function buildInterior(){
  const interior = new THREE.Group();
  scene.add(interior);
  const delays = [1.25, 1.4, 1.55, 1.7, 1.85, 2.0];
  const box = (p,w,h,d,mat,x,y,z,ry=0, rz=0) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
    m.position.set(x,y,z); m.rotation.set(0,ry,rz); p.add(m); return m;
  };
  const cyl = (p,rt,rb,h,mat,x,y,z,seg=12) => {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg), mat);
    m.position.set(x,y,z); p.add(m); return m;
  };
  const pnl = (p,w,h,mat,x,y,z,rx=0,ry=0) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat);
    m.position.set(x,y,z); m.rotation.set(rx,ry,0); p.add(m); return m;
  };

  const floorMat = toon(0xf0dfba);
  const floor = box(interior,16,0.06,10.2,floorMat,0,0.13,-3.5);
  reg(floor,1.25);

  const ceilMat = toon(0xf7f3e8);
  const ceil = box(interior,16,0.15,10.2,ceilMat,0,6.3,-3.5);
  reg(ceil,1.35);

  for(let r=0;r<2;r++){
    for(let c=0;c<3;c++){
      const lx = -5 + c*5;
      const lz = -2 + r*(-3);
      const lamp = box(interior,2.2,0.08,1.1,glowMat(0xfff3d6),lx,6.2,lz);
      reg(lamp,1.4 + c*0.05 + r*0.08);
    }
  }

  const light1 = new THREE.PointLight(0xffd9a0,130,22,1.5);
  light1.position.set(-4,5.2,-3.5);
  scene.add(light1);
  const light2 = new THREE.PointLight(0xffd9a0,130,22,1.5);
  light2.position.set(4,5.2,-3.5);
  scene.add(light2);
  const light3 = new THREE.PointLight(0xffe6bb,110,19,1.5);
  light3.position.set(0,5.4,-6.0);
  scene.add(light3);
  const light4 = new THREE.PointLight(0xffe6bb,85,17,1.5);
  light4.position.set(0,4.4,-0.6);
  scene.add(light4);

  const shelfMat = toon(0xe8e4da);
  const palette = [0xe74c3c,0xf39c12,0xf1c40f,0x27ae60,0x2980b9,0x9b59b6,0xff7fab,0xf5f5f5];
  const aisleXs = [-4.6,0,4.6];
  const aisleZc = -4.4;
  const aisleLen = 6.4;
  const aisleW = 1.4;

  aisleXs.forEach((ax, ai)=>{
    const group = new THREE.Group();
    interior.add(group);
    const z1 = aisleZc - aisleLen/2;
    const z2 = aisleZc + aisleLen/2;
    const sideL = box(group,0.35,3.0,aisleW,shelfMat,ax,1.6,z1);
    const sideR = box(group,0.35,3.0,aisleW,shelfMat,ax,1.6,z2);
    const back = box(group,0.08,3.0,aisleLen,shelfMat,ax-0.7,1.6,aisleZc);
    reg(sideL,1.45 + ai*0.08);
    reg(sideR,1.45 + ai*0.08);
    reg(back,1.45 + ai*0.08);

    for(let layer=0; layer<4; layer++){
      const ly = 0.25 + layer*0.82;
      const shelf = box(group,aisleW,0.14,aisleLen,shelfMat,ax,ly,aisleZc);
      reg(shelf,1.5 + ai*0.06 + layer*0.05);
      for(let i=0;i<9;i++){
        const bz = z1 + 0.45 + i*((aisleLen-0.9)/8);
        const cidx = ((i*7 + ai*3 + layer)%8 + 8)%8;
        const itemMat = toon(palette[cidx]);
        itemMat.emissive = new THREE.Color(palette[cidx]); itemMat.emissiveIntensity = 0.38;
        const item = box(group,0.4,0.7,0.55,itemMat,ax,ly+0.35,bz);
        item.rotation.x = (i%3)*0.08;
        reg(item,1.55 + ai*0.05 + layer*0.06 + i*0.015);
      }
    }
    const price = box(group,aisleW-0.2,0.1,aisleLen-0.4,toon(0xffe066),ax,3.68,aisleZc);
    reg(price,1.75 + ai*0.06);
  });

  const fridgeGroup = new THREE.Group();
  interior.add(fridgeGroup);
  const fridgeBody = box(fridgeGroup,12,3.4,0.9,toon(0x5a6270),0,1.8,-8.1);
  reg(fridgeBody,1.85);
  const glassMat = new THREE.MeshPhongMaterial({color:0xaad4f5,transparent:true,opacity:0.18,shininess:140});
  const drinkColors = [0xff6b6b,0x4ecdc4,0xffe66d,0x1e90ff,0xff9f43,0xa29bfe];

  PLN(board, 2.15, 1.35, toon(0x2e5d46), 0, 1.6, 0.16, 0, 0);
  const paperColors = [0xff6b57, 0x4ea8de, 0xf4d35e, 0xa88de0, 0x6dd18e, 0xff9e7a];
  for (let i = 0; i < 6; i++) {
    const px = -0.85 + (i % 3) * 0.85, py = 1.95 - Math.floor(i / 3) * 0.65;
    PLN(board, 0.42, 0.34, new THREE.MeshBasicMaterial({ color: paperColors[i] }), px + (i % 2) * 0.1, py, 0.315, 0, 0);

function buildRain() {
  const count = 900;
  const geo = new THREE.BoxGeometry(0.02, 1, 0.02);
  const mat = new THREE.MeshBasicMaterial({ color: 0xa9c6ee, transparent: true, opacity: 0.4, depthWrite: false });
  const rain = new THREE.InstancedMesh(geo, mat, count);
  rain.frustumCulled = false;
  const drops = [];
  for (let i = 0; i < count; i++) {
    const x = ((i * 137.51) % 46) - 23;
    const z = ((i * 271.37) % 46) - 23;
    const y = (i * 89.77) % 28;
    const speed = 15 + ((i * 7) % 9);
    const len = 0.55 + ((i * 13) % 10) * 0.05;
    drops.push({ x, initX: x, z, y, speed, len });
  }
  const dummy = new THREE.Object3D();
  rain.userData.update = function (dt) {
    for (let i = 0; i < count; i++) {
      const d = drops[i];
      d.y -= d.speed * dt;
      d.x += dt * 1.8;
      if (d.y < 0) {
        d.y += 28;
        d.x = d.initX;
      }
      dummy.position.set(d.x, d.y, d.z);
      dummy.rotation.set(0.03, 0, 0.11);
      dummy.scale.set(1, d.len, 1);
      dummy.updateMatrix();
      rain.setMatrixAt(i, dummy.matrix);
    }
    rain.instanceMatrix.needsUpdate = true;
  };
  rain.userData.update(0);
  scene.add(rain);
  if (typeof RAIN !== 'undefined') RAIN = rain;

  if (typeof RIPPLES !== 'undefined') {
    RIPPLES.length = 0;
    for (let i = 0; i < 10; i++) {
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.16, 0.21, 24),
        new THREE.MeshBasicMaterial({ color: 0x8fb4ff, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
      );
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(((i * 37.7) % 30) - 14, 0.145, ((i * 53.3) % 22) + 1);
      scene.add(ring);
      RIPPLES.push({ mesh: ring, phase: i / 10 });
    }
  }
}

function buildSnow() {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 64;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.4, 'rgba(255,255,255,.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(cv);
  const cfg = [{n:450,size:0.32,op:0.5,sp:1.0},{n:320,size:0.55,op:0.7,sp:1.5},{n:180,size:0.9,op:0.9,sp:2.1}];
  SNOW = new THREE.Group();
  SNOW.visible = false;
  cfg.forEach(L => {
    const pos = new Float32Array(L.n * 3);
    const data = [];
    for (let i = 0; i < L.n; i++) {
      data.push({
        bx: ((i * 137.51) % 46) - 23,
        bz: ((i * 271.37) % 46) - 23,
        y: (i * 61.7) % 26,
        speed: L.sp * (0.7 + ((i * 29) % 10) * 0.06),
        phase: (i * 47.3) % 6.283,
        amp: 0.3 + ((i * 17) % 10) * 0.07,
        swayF: 0.5 + ((i * 13) % 10) * 0.08
      });
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.userData = data;
    const mat = new THREE.PointsMaterial({size:L.size,map:tex,transparent:true,opacity:L.op,depthWrite:false,sizeAttenuation:true,color:0xf4f8ff});
    const points = new THREE.Points(geo, mat);
    points.frustumCulled = false;
    SNOW.add(points);
  });
  scene.add(SNOW);
  SNOW.frustumCulled = false;
  SNOW.userData.update = function(dt, t) {
    SNOW.children.forEach(points => {
      const geo = points.geometry;
      const pos = geo.attributes.position.array;
      const data = geo.userData;
      for (let i = 0; i < data.length; i++) {
        const d = data[i];
        d.y -= d.speed * dt;
        if (d.y < 0) d.y += 26;
        const idx = i * 3;
        pos[idx] = d.bx + Math.sin(t * d.swayF + d.phase) * d.amp;
        pos[idx + 1] = d.y;
        pos[idx + 2] = d.bz + Math.cos(t * d.swayF * 0.8 + d.phase) * d.amp * 0.6;
      }
      geo.attributes.position.needsUpdate = true;
    });
  };
  SNOW.userData.update(0, 0);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  for (const it of ASSEMBLY) {
    const p = Math.min(Math.max((t - it.delay) / 1.4, 0), 1);
    const e = 1 - Math.pow(1 - p, 3);
    it.obj.position.y = it.obj.userData.finalY - 6 * (1 - e);
  }
  if (RAIN && RAIN.userData && RAIN.userData.update) RAIN.userData.update(dt);
  if (SNOW && SNOW.userData && SNOW.userData.update) SNOW.userData.update(dt, t);
  for (const rp of RIPPLES) {
    const s = (t * 0.8 + rp.phase) % 1;
    rp.mesh.scale.setScalar(0.4 + s * 2.4);
    rp.mesh.material.opacity = 0.5 * (1 - s);
  }
  controls.update();
  renderer.render(scene, camera);
}

    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
