const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3.2, 2.0, 4.2);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 2.2;
controls.minDistance = 2.2;
controls.maxDistance = 10;

const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3,5,4); scene.add(key);
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.7); fill.position.set(-4,2,-3); scene.add(fill);
scene.add(new THREE.AmbientLight(0xffffff, 0.35));

const spinBtn = document.getElementById('spinBtn');
function setSpin(on){
  controls.autoRotate = on;
  spinBtn.textContent = on ? '⏸ 暂停旋转' : '▶ 自动旋转';
  spinBtn.classList.toggle('off', !on);
}
spinBtn.addEventListener('click', () => setSpin(!controls.autoRotate));
controls.addEventListener('start', () => { if (controls.autoRotate) setSpin(false); });

new GLTFLoader().load(GLB_DATA, (gltf) => {
  const model = gltf.scene;
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const s = 2.6 / Math.max(size.x, size.y, size.z);
  model.scale.setScalar(s);
  model.position.sub(center.multiplyScalar(s));
  scene.add(model);
}, undefined, (e) => {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.textContent = '模型加载失败，请检查网络后刷新页面。';
  console.error(e);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
